<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lbrowser Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #202124;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e8eaed;
            padding: 20px;
            overflow-x: hidden;
            transition: background 0.5s, color 0.5s;
        }

        body.light { background: #ffffff; color: #202124; }

        .top-bar {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 300;
        }

        .clock {
            font-size: 14px;
            color: #9aa0a6;
            transition: opacity 0.3s;
        }
        body.light .clock { color: #5f6368; }
        .clock.hidden { opacity: 0; pointer-events: none; }

        .top-btn {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.3s;
            color: inherit;
            min-width: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .top-btn:active { background: #303134; }
        body.light .top-btn:active { background: #f1f3f4; }

        .logo {
            font-size: 52px;
            font-weight: bold;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #4285f4, #ea4335, #fbbc05, #34a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            line-height: 1.1;
        }

        .subtitle {
            color: #9aa0a6;
            font-size: 13px;
            margin-bottom: 25px;
            text-align: center;
        }
        body.light .subtitle { color: #5f6368; }

        .search-box {
            display: flex;
            align-items: center;
            background: #303134;
            border: 1px solid #5f6368;
            border-radius: 25px;
            padding: 3px 3px 3px 18px;
            width: 100%;
            max-width: 500px;
            transition: 0.3s;
            margin-bottom: 18px;
        }
        body.light .search-box { background: #ffffff; border-color: #dadce0; }
        .search-box:focus-within {
            border-color: #4285f4;
            box-shadow: 0 0 0 2px rgba(66,133,244,0.2);
        }

        input[type="text"] {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            padding: 14px 8px;
            color: #e8eaed;
            min-width: 0;
        }
        body.light input[type="text"] { color: #202124; }
        input::placeholder { color: #9aa0a6; }

        .search-btn {
            background: #4285f4;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 12px 18px;
            border-radius: 22px;
            transition: 0.2s;
        }
        .search-btn:active { background: #1a73e8; transform: scale(0.95); }

        .buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            background: #303134;
            color: #e8eaed;
            border: 1px solid #5f6368;
            border-radius: 10px;
            padding: 14px 10px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        body.light .btn { background: #f8f9fa; color: #202124; border-color: #dadce0; }
        .btn:active { border-color: #8ab4f8; color: #8ab4f8; transform: scale(0.97); }

        .bookmark-btn {
            margin-top: 5px;
            color: #fbbc05;
            cursor: pointer;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 20px;
            transition: 0.3s;
            background: transparent;
            border: 1px solid #fbbc05;
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-bottom: 10px;
        }
        .bookmark-btn:active { background: #fbbc05; color: #202124; }

        .advanced-toggle {
            margin-top: 5px;
            color: #8ab4f8;
            cursor: pointer;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 20px;
            transition: 0.3s;
            background: transparent;
            border: 1px solid #5f6368;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        body.light .advanced-toggle { border-color: #dadce0; }
        .advanced-toggle:active { background: #303134; }

        .advanced-panel {
            margin-top: 15px;
            background: #303134;
            border: 1px solid #5f6368;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 500px;
            display: none;
        }
        body.light .advanced-panel { background: #ffffff; border-color: #dadce0; }
        .advanced-panel.open { display: block; }

        .advanced-panel h3 { font-size: 15px; margin-bottom: 10px; }

        .advanced-description {
            background: #202124;
            border-left: 3px solid #4285f4;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 12px;
            line-height: 1.5;
            color: #bdc1c6;
        }
        body.light .advanced-description { background: #f8f9fa; color: #5f6368; }
        .advanced-description b { color: #8ab4f8; }

        .advanced-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .advanced-row select,
        .advanced-row input {
            padding: 12px;
            background: #202124;
            border: 1px solid #5f6368;
            border-radius: 8px;
            color: #e8eaed;
            font-size: 14px;
            outline: none;
            width: 100%;
        }
        body.light .advanced-row select,
        body.light .advanced-row input {
            background: #f8f9fa; color: #202124; border-color: #dadce0;
        }
        .advanced-row select:focus,
        .advanced-row input:focus { border-color: #4285f4; }

        .advanced-row button {
            padding: 12px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .advanced-row button:active { background: #1a73e8; transform: scale(0.97); }

        .panel {
            position: fixed;
            top: 0;
            right: 0;
            background: #303134;
            border-left: 1px solid #5f6368;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            height: 100vh;
            box-shadow: -8px 0 24px rgba(0,0,0,0.5);
            transform: translateX(100%);
            transition: transform 0.3s;
            z-index: 200;
            overflow-y: auto;
        }
        body.light .panel { background: #ffffff; border-color: #dadce0; }
        .panel.open { transform: translateX(0); }

        .panel h3 {
            font-size: 16px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #5f6368;
        }
        body.light .panel h3 { border-color: #dadce0; }

        .close-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #9aa0a6;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }

        .setting-item { margin-bottom: 18px; }
        .setting-item > label {
            display: block;
            font-size: 13px;
            color: #9aa0a6;
            margin-bottom: 8px;
        }
        body.light .setting-item > label { color: #5f6368; }

        .setting-item select {
            width: 100%;
            padding: 12px;
            background: #202124;
            border: 1px solid #5f6368;
            border-radius: 8px;
            color: #e8eaed;
            font-size: 14px;
            cursor: pointer;
        }
        body.light .setting-item select {
            background: #f8f9fa; color: #202124; border-color: #dadce0;
        }

        .setting-item input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #4285f4;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }
        .toggle-row span { font-size: 14px; }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #5f6368;
            transition: 0.3s;
            border-radius: 24px;
        }
        .switch .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        .switch input:checked + .slider { background-color: #4285f4; }
        .switch input:checked + .slider:before { transform: translateX(20px); }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #ea4335;
            border: 1px solid #ea4335;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .reset-btn:active { background: #ea4335; color: white; }

        .history-list,
        .bookmarks-list {
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #5f6368;
            border-radius: 8px;
            padding: 8px;
        }
        body.light .history-list,
        body.light .bookmarks-list { border-color: #dadce0; }

        .history-item,
        .bookmark-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            font-size: 13px;
            border-radius: 6px;
            margin-bottom: 4px;
        }
        .history-item:active,
        .bookmark-item:active { background: #3c4043; }

        .history-item a,
        .bookmark-item a {
            color: #8ab4f8;
            text-decoration: none;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 8px;
        }

        .history-item button,
        .bookmark-item button {
            background: transparent;
            border: none;
            color: #ea4335;
            cursor: pointer;
            font-size: 16px;
            padding: 0 8px;
        }

        .empty-msg {
            font-size: 12px;
            color: #9aa0a6;
            text-align: center;
            padding: 20px;
        }

        .clear-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #fbbc05;
            border: 1px solid #fbbc05;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .clear-btn:active { background: #fbbc05; color: #202124; }

        .footer {
            position: fixed;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            color: #5f6368;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="clock" id="clock"></div>
        <button class="top-btn" onclick="toggleSettings(event)">⚙️</button>
        <button class="top-btn" onclick="toggleHistory(event)">🔎</button>
        <button class="top-btn" onclick="toggleBookmarks(event)">⭐</button>
    </div>

    <div class="panel" id="settingsPanel">
        <button class="close-panel" onclick="toggleSettings(event)">✕</button>
        <h3>⚙️ Настройки</h3>

        <div class="setting-item">
            <label>Поисковик по умолчанию</label>
            <select id="searchEngine" onchange="saveSettings()">
                <option value="google" selected>Google</option>
                <option value="yandex">Яндекс</option>
                <option value="bing">Bing</option>
                <option value="duckduckgo">DuckDuckGo</option>
            </select>
        </div>

        <div class="setting-item">
            <label>Размер шрифта: <span id="fontSizeLabel">16</span>px</label>
            <input type="range" id="fontSize" min="12" max="28" value="16" oninput="changeFontSize(this.value)">
        </div>

        <div class="toggle-row">
            <span>Светлая тема</span>
            <label class="switch">
                <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-row">
            <span>Авто-тема (по времени)</span>
            <label class="switch">
                <input type="checkbox" id="autoThemeToggle" checked onchange="toggleAutoTheme()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-row">
            <span>Показывать часы</span>
            <label class="switch">
                <input type="checkbox" id="clockToggle" checked onchange="toggleClock()">
                <span class="slider"></span>
            </label>
        </div>

        <button class="reset-btn" onclick="resetSettings()">Сбросить настройки</button>
    </div>

    <div class="panel" id="historyPanel">
        <button class="close-panel" onclick="toggleHistory(event)">✕</button>
        <h3>🔎 История поиска</h3>

        <div class="history-list" id="historyList">
            <div class="empty-msg">Пусто</div>
        </div>

        <button class="clear-btn" onclick="clearHistory()">Очистить историю</button>
    </div>

    <div class="panel" id="bookmarksPanel">
        <button class="close-panel" onclick="toggleBookmarks(event)">✕</button>
        <h3>⭐ Закладки</h3>

        <div class="bookmarks-list" id="bookmarksList">
            <div class="empty-msg">Пусто</div>
        </div>

        <button class="clear-btn" onclick="clearBookmarks()">Очистить закладки</button>
    </div>

    <div class="logo">Lbrowser</div>
    <div class="subtitle">Поиск, который принадлежит тебе</div>

    <div class="search-box">
        <input type="text" id="query" placeholder="Введите запрос..." autofocus>
        <button class="search-btn" onclick="search()">🔍</button>
    </div>

    <div class="buttons">
        <button class="btn" onclick="search()">Найти</button>
        <button class="btn" onclick="lucky()">Мне повезёт!</button>
    </div>

    <button class="bookmark-btn" onclick="addBookmark()">⭐ Добавить в закладки</button>

    <button class="advanced-toggle" onclick="toggleAdvanced()">⚡ Расширенный режим</button>

    <div class="advanced-panel" id="advancedPanel">
        <h3>⚡ Расширенный режим</h3>
        <div class="advanced-description">
            <b>Что это?</b> Поиск <b>только по Википедии</b>. Удобно, когда нужна <b>точная информация</b>.
        </div>
        <div class="advanced-row">
            <select id="advancedEngine">
                <option value="ru">🇷🇺 Русская Википедия</option>
                <option value="en">🇬🇧 English Wikipedia</option>
            </select>
            <input type="text" id="advancedQuery" placeholder="Запрос в Википедию...">
            <button onclick="advancedSearch()">Искать</button>
        </div>
    </div>

    <div class="footer">© 2026 Lbrowser — v1.1</div>

    <script>
        function applyAutoTheme() {
            var autoTheme = localStorage.getItem('lbrowserAutoTheme');
            if (autoTheme === 'false') return;

            var hour = new Date().getHours();
            var isDay = hour >= 7 && hour < 19;

            if (isDay) {
                document.body.classList.add('light');
                document.getElementById('themeToggle').checked = true;
            } else {
                document.body.classList.remove('light');
                document.getElementById('themeToggle').checked = false;
            }
        }

        function toggleAutoTheme() {
            var enabled = document.getElementById('autoThemeToggle').checked;
            localStorage.setItem('lbrowserAutoTheme', enabled);
            if (enabled) applyAutoTheme();
        }

        function closeAllPanels() {
            document.getElementById('settingsPanel').classList.remove('open');
            document.getElementById('historyPanel').classList.remove('open');
            document.getElementById('bookmarksPanel').classList.remove('open');
            document.getElementById('clock').classList.remove('hidden');
        }

        function toggleSettings(event) {
            if (event) event.stopPropagation();
            var panel = document.getElementById('settingsPanel');
            var isOpen = panel.classList.contains('open');
            closeAllPanels();
            if (!isOpen) {
                panel.classList.add('open');
                document.getElementById('clock').classList.add('hidden');
            }
        }

        function toggleHistory(event) {
            if (event) event.stopPropagation();
            var panel = document.getElementById('historyPanel');
            var isOpen = panel.classList.contains('open');
            closeAllPanels();
            if (!isOpen) {
                panel.classList.add('open');
                document.getElementById('clock').classList.add('hidden');
                loadHistory();
            }
        }

        function toggleBookmarks(event) {
            if (event) event.stopPropagation();
            var panel = document.getElementById('bookmarksPanel');
            var isOpen = panel.classList.contains('open');
            closeAllPanels();
            if (!isOpen) {
                panel.classList.add('open');
                document.getElementById('clock').classList.add('hidden');
                loadBookmarks();
            }
        }

        function toggleAdvanced() {
            document.getElementById('advancedPanel').classList.toggle('open');
        }

        function saveSettings() {
            var settings = {
                engine: document.getElementById('searchEngine').value,
                fontSize: document.getElementById('fontSize').value,
                showClock: document.getElementById('clockToggle').checked
            };
            localStorage.setItem('lbrowserSettings', JSON.stringify(settings));
        }

        function loadSettings() {
            var saved = localStorage.getItem('lbrowserSettings');
            if (saved) {
                var s = JSON.parse(saved);
                document.getElementById('searchEngine').value = s.engine || 'google';
                document.getElementById('fontSize').value = s.fontSize || 16;
                document.getElementById('fontSizeLabel').textContent = s.fontSize || 16;
                document.getElementById('query').style.fontSize = (s.fontSize || 16) + 'px';
                if (s.showClock === false) {
                    document.getElementById('clock').style.display = 'none';
                    document.getElementById('clockToggle').checked = false;
                }
            }
            loadHistory();
            loadBookmarks();
            applyAutoTheme();
        }

        function changeFontSize(size) {
            document.getElementById('query').style.fontSize = size + 'px';
            document.getElementById('fontSizeLabel').textContent = size;
            saveSettings();
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
            document.getElementById('autoThemeToggle').checked = false;
            localStorage.setItem('lbrowserAutoTheme', 'false');
        }

        function toggleClock() {
            var clock = document.getElementById('clock');
            clock.style.display = clock.style.display === 'none' ? 'block' : 'none';
            saveSettings();
        }

        function resetSettings() {
            if (confirm('Сбросить все настройки?')) {
                localStorage.clear();
                location.reload();
            }
        }

        function addHistory(query) {
            var history = JSON.parse(localStorage.getItem('lbrowserHistory') || '[]');
            history = history.filter(h => h.query !== query);
            history.unshift({ query: query, time: new Date().toLocaleString('ru-RU') });
            if (history.length > 50) history = history.slice(0, 50);
            localStorage.setItem('lbrowserHistory', JSON.stringify(history));
        }

        function loadHistory() {
            var list = document.getElementById('historyList');
            if (!list) return;
            var history = JSON.parse(localStorage.getItem('lbrowserHistory') || '[]');
            if (history.length === 0) {
                list.innerHTML = '<div class="empty-msg">Пусто</div>';
                return;
            }
            list.innerHTML = history.map((h, i) => `
                <div class="history-item">
                    <a href="#" onclick="searchFromHistory('${h.query.replace(/'/g, "\\'")}'); return false;">🔍 ${h.query}</a>
                    <button onclick="removeHistory(${i})">✕</button>
                </div>
            `).join('');
        }

        function searchFromHistory(query) {
            document.getElementById('query').value = query;
            closeAllPanels();
            search();
        }

        function removeHistory(index) {
            var history = JSON.parse(localStorage.getItem('lbrowserHistory') || '[]');
            history.splice(index, 1);
            localStorage.setItem('lbrowserHistory', JSON.stringify(history));
            loadHistory();
        }

        function clearHistory() {
            if (confirm('Очистить всю историю?')) {
                localStorage.removeItem('lbrowserHistory');
                loadHistory();
            }
        }

        function addBookmark() {
            var q = document.getElementById('query').value.trim();
            if (q === '') {
                alert('Введите запрос или URL');
                return;
            }
            var bookmarks = JSON.parse(localStorage.getItem('lbrowserBookmarks') || '[]');
            if (bookmarks.some(b => b.query === q)) {
                alert('Уже в закладках');
                return;
            }
            bookmarks.unshift({ query: q, time: new Date().toLocaleString('ru-RU') });
            if (bookmarks.length > 50) bookmarks = bookmarks.slice(0, 50);
            localStorage.setItem('lbrowserBookmarks', JSON.stringify(bookmarks));
            loadBookmarks();
            alert('⭐ Добавлено в закладки: ' + q);
        }

        function loadBookmarks() {
            var list = document.getElementById('bookmarksList');
            if (!list) return;
            var bookmarks = JSON.parse(localStorage.getItem('lbrowserBookmarks') || '[]');
            if (bookmarks.length === 0) {
                list.innerHTML = '<div class="empty-msg">Пусто</div>';
                return;
            }
            list.innerHTML = bookmarks.map((b, i) => `
                <div class="bookmark-item">
                    <a href="#" onclick="searchFromHistory('${b.query.replace(/'/g, "\\'")}'); return false;">⭐ ${b.query}</a>
                    <button onclick="removeBookmark(${i})">✕</button>
                </div>
            `).join('');
        }

        function removeBookmark(index) {
            var bookmarks = JSON.parse(localStorage.getItem('lbrowserBookmarks') || '[]');
            bookmarks.splice(index, 1);
            localStorage.setItem('lbrowserBookmarks', JSON.stringify(bookmarks));
            loadBookmarks();
        }

        function clearBookmarks() {
            if (confirm('Очистить все закладки?')) {
                localStorage.removeItem('lbrowserBookmarks');
                loadBookmarks();
            }
        }

        function getEngineUrl(engine) {
            var urls = {
                google: 'https://www.google.com/search?q=',
                yandex: 'https://yandex.ru/search/?text=',
                bing: 'https://www.bing.com/search?q=',
                duckduckgo: 'https://duckduckgo.com/?q='
            };
            return urls[engine] || urls.google;
        }

        function search() {
            var q = document.getElementById('query').value.trim();
            if (q === '') { document.getElementById('query').focus(); return; }
            addHistory(q);
            var engine = document.getElementById('searchEngine').value;
            window.location.href = getEngineUrl(engine) + encodeURIComponent(q);
        }

        function lucky() {
            var q = document.getElementById('query').value.trim();
            if (q === '') return;
            addHistory(q);
            window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q) + '&btnI=1';
        }

        function advancedSearch() {
            var q = document.getElementById('advancedQuery').value.trim();
            if (q === '') { document.getElementById('advancedQuery').focus(); return; }
            addHistory(q);
            var lang = document.getElementById('advancedEngine').value;
            window.location.href = 'search.html?q=' + encodeURIComponent(q) + '&lang=' + lang;
        }

        document.getElementById('query').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') search();
        });

        document.getElementById('advancedQuery').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') advancedSearch();
        });

        function updateClock() {
            var now = new Date();
            document.getElementById('clock').textContent =
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0');
        }
        setInterval(updateClock, 1000);
        updateClock();

        document.addEventListener('click', function(e) {
            var topBar = document.querySelector('.top-bar');
            if (!topBar.contains(e.target)) {
                var panels = document.querySelectorAll('.panel');
                panels.forEach(function(panel) {
                    if (panel.classList.contains('open') && !panel.contains(e.target)) {
                        panel.classList.remove('open');
                        document.getElementById('clock').classList.remove('hidden');
                    }
                });
            }
        });

        setInterval(function() {
            var autoTheme = localStorage.getItem('lbrowserAutoTheme');
            if (autoTheme !== 'false') applyAutoTheme();
        }, 5 * 60 * 1000);

        loadSettings();
    </script>
</body>
</html>
